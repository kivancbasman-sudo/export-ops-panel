    <script>
      (function () {
        // 1. Intercept console.error for benign Vite HMR disconnections
        var origConsoleError = console.error;
        console.error = function () {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg) {
              str += (arg && arg.stack ? arg.stack : String(arg)) + ' ';
            }
          }
          if (str.indexOf('WebSocket closed without opened') !== -1 || (str.indexOf('WebSocket') !== -1 && str.indexOf('vite') !== -1)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        // 2. Prevent window unhandled error/rejection
        window.addEventListener('error', function (event) {
          var msg = event && (event.message || (event.error && event.error.message)) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reasonMsg = event && event.reason && (event.reason.message || event.reason.stack || String(event.reason)) || '';
          if (typeof reasonMsg === 'string' && (reasonMsg.indexOf('WebSocket') !== -1 || reasonMsg.indexOf('vite') !== -1)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        // 3. Graceful vite-hmr WebSocket stub to avoid failing connection attempts
        if (typeof window.WebSocket !== 'undefined') {
          var OrigWS = window.WebSocket;
          window.WebSocket = function (url, protocols) {
            var isHmr = (protocols === 'vite-hmr') ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/') !== -1));
            if (isHmr) {
              var listeners = {};
              var fakeWS = {
                url: url,
                readyState: 1, // OPEN
                protocol: 'vite-hmr',
                extensions: '',
                binaryType: 'blob',
                bufferedAmount: 0,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function () {},
                close: function () {
                  this.readyState = 3;
                },
                addEventListener: function (type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener: function (type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function (f) { return f !== fn; });
                },
                dispatchEvent: function () { return true; }
              };
              setTimeout(function () {
                var openEvt = new Event('open');
                if (fakeWS.onopen) {
                  try { fakeWS.onopen(openEvt); } catch (e) {}
                }
                if (listeners['open']) {
                  listeners['open'].forEach(function (f) {
                    try { f(openEvt); } catch (e) {}
                  });
                }
              }, 10);
              return fakeWS;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }
      })();
    </script>
